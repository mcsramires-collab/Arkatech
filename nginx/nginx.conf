events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream backend_api {
        server api:3000;
    }

    upstream frontend_web {
        server web:80;
    }

    server {
        listen 80;
        server_name api.arckatech.com.br app.arckatech.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # API Server (HTTPS)
    server {
        listen 443 ssl;
        server_name api.arckatech.com.br;

        ssl_certificate /etc/letsencrypt/live/api.arckatech.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.arckatech.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 50M;

        location / {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Portal Web App (HTTPS)
    server {
        listen 443 ssl;
        server_name app.arckatech.com.br;

        ssl_certificate /etc/letsencrypt/live/app.arckatech.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.arckatech.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://frontend_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
