name: CI - Integracao Continua

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          cd backend
          npm ci || npm install
      - name: Type check
        run: |
          cd backend
          npm run typecheck --if-present
      - name: Run Tests
        run: |
          cd backend
          npm test --if-present
      - name: Run P0 Test Lab regression gate
        run: |
          cd backend
          npm run test:lab:p0

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install
      - name: Build Check
        run: |
          cd frontend
          npm run build


  backend-docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image
        run: docker build -t arckatech-backend-ci ./backend
