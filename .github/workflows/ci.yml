name: CI - Integracao Continua

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          cd backend
          npm ci
      - name: Type check
        run: |
          cd backend
          npm run typecheck
      - name: Run Tests
        run: |
          cd backend
          npm test -- --runInBand
      - name: Run P0 Test Lab regression gate
        run: |
          cd backend
          npm run test:lab:p0
      - name: Run P1 Test Lab regression suite
        run: |
          cd backend
          npm run test:lab:p1

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check frontend
        run: cd frontend && npm run typecheck
      - name: Build Check
        run: |
          cd frontend
          npm run build


  frontend-docker-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build production frontend image
        run: docker build -t arckatech-frontend-ci ./frontend
      - name: Smoke test Nginx BFF image
        run: |
          docker run -d --name arckatech-frontend-smoke \
            -e INTERNAL_API_KEY=ci-only-test-key \
            -e BACKEND_API_URL=http://127.0.0.1:65535 \
            -p 8080:80 \
            arckatech-frontend-ci
          sleep 2
          docker exec arckatech-frontend-smoke nginx -t
          curl --fail http://127.0.0.1:8080/
          docker rm -f arckatech-frontend-smoke

  test-lab-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Install backend for real browser journeys
        run: cd backend && npm ci
      - name: Install Chromium
        timeout-minutes: 5
        run: |
          cd frontend
          npx playwright install --with-deps chromium
      - name: Run Test Lab browser E2E
        run: |
          cd frontend
          npm run test:e2e

  backend-docker-build:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build production backend image
        run: docker build -t arckatech-backend-ci ./backend
